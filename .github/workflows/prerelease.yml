name: Stage 7 Conditional Prerelease

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character CONDITIONAL_GO candidate SHA
        required: true
        type: string
      release_id:
        description: Ephemeral release identifier rel-YYYYMMDD-HHMM-sha7
        required: true
        type: string
      config_sha256:
        description: SHA-256 of the approved STAGE7_CONFIG_B64 payload
        required: true
        type: string
      stage6_run_id:
        description: Exact Stage 6 workflow run containing CONDITIONAL_GO evidence
        required: true
        type: string
      stage6_manifest_sha256:
        description: SHA-256 of the Stage 6 closeout manifest from that run
        required: true
        type: string
      confirm_deploy:
        description: Confirm the protected non-public ephemeral deployment
        required: true
        default: false
        type: boolean
      confirm_sandbox_smoke:
        description: Separately confirm the authorized low-volume sandbox smoke
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stage7-assessment-prerelease
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.19.0'
  STAGE7_AWS_ACCOUNT_ID: ${{ vars.STAGE7_AWS_ACCOUNT_ID }}
  STAGE7_AWS_REGION: ${{ vars.STAGE7_PRERELEASE_AWS_REGION }}
  STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  STAGE7_EVIDENCE_ROOT: output/evidence/runtime/stage-7-prerelease
  STAGE7_PRERELEASE_CLEANUP_WATCHDOG_ROLE_ARN: ${{ vars.STAGE7_PRERELEASE_CLEANUP_WATCHDOG_ROLE_ARN }}
  STAGE7_RELEASE_ID: ${{ inputs.release_id }}

jobs:
  prerelease-metadata:
    name: 01 Conditional prerelease metadata
    if: >-
      github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'ivanmonsalve0404/async-checkout-demo'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_PRERELEASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Validate immutable conditional prerelease identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE6_RUN_ID: ${{ inputs.stage6_run_id }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_ID}" =~ ^rel-[0-9]{8}-[0-9]{4}-[0-9a-f]{7}$ ]]
          test "${RELEASE_ID##*-}" = "${CANDIDATE_SHA:0:7}"
          [[ "${STAGE6_RUN_ID}" =~ ^[0-9]{1,20}$ ]]
          [[ "${STAGE6_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/master)" = "${CANDIDATE_SHA}"
          test "${GITHUB_REF}" = 'refs/heads/master'
          test "${GITHUB_REPOSITORY}" = 'ivanmonsalve0404/async-checkout-demo'
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize required manual accessibility evidence
        env:
          STAGE6_A11Y_MANUAL_EVIDENCE_B64: ${{ vars.STAGE6_A11Y_MANUAL_EVIDENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE6_A11Y_MANUAL_EVIDENCE_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage6-a11y-manual.json"
          printf '%s' "${STAGE6_A11Y_MANUAL_EVIDENCE_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          printf 'STAGE6_A11Y_MANUAL_EVIDENCE=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Validate CONDITIONAL_GO scope without external mutation
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
        run: pnpm release:preflight -- --scope prerelease --local-only --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}" --require-e6-conditional-go --evidence "${STAGE7_EVIDENCE_ROOT}/metadata.json"
      - name: Preserve the exact validated Stage 6 closeout bytes
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
        run: |
          set -euo pipefail
          mapfile -d '' matches < <(find .stage7/stage6 -type f -name closeout.json -print0)
          test "${#matches[@]}" -eq 1
          cp -- "${matches[0]}" "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json"
          test "$(sha256sum "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json" | cut -d ' ' -f 1)" = "${STAGE6_MANIFEST_SHA256}"
          pnpm release:scan -- --scope prerelease --pre-upload "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json"
      - name: Preserve sanitized prerelease metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-metadata
          if-no-files-found: error
          path: |
            output/evidence/runtime/stage-7-prerelease/metadata.json
            output/evidence/runtime/stage-7-prerelease/stage6-closeout.json
          retention-days: 30

  verify-candidate:
    name: 02 Revalidate conditional candidate
    if: ${{ github.run_attempt == 1 }}
    needs: prerelease-metadata
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Materialize required manual accessibility evidence
        env:
          STAGE6_A11Y_MANUAL_EVIDENCE_B64: ${{ vars.STAGE6_A11Y_MANUAL_EVIDENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE6_A11Y_MANUAL_EVIDENCE_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage6-a11y-manual.json"
          printf '%s' "${STAGE6_A11Y_MANUAL_EVIDENCE_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          printf 'STAGE6_A11Y_MANUAL_EVIDENCE=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Revalidate candidate without upgrading the entry gate
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
        run: pnpm release:verify-candidate -- --scope prerelease --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}" --require-e6-conditional-go
      - name: Preserve sanitized candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-candidate-verification
          if-no-files-found: error
          path: output/evidence/runtime/stage-7-prerelease/verify-candidate.json
          retention-days: 30

  build-once:
    name: 03 Build once and freeze
    if: ${{ github.run_attempt == 1 }}
    needs: verify-candidate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_PRERELEASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Build, package and synthesize the candidate exactly once
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm release:build
          pnpm infra:synth:release -- --scope prerelease --initial-release --output output/release/build/iac
          pnpm release:scan -- --scope prerelease --pre-upload output/release/build/api output/release/build/worker output/release/build/web output/release/build/iac output/release/build/public-config.json
      - name: Preserve immutable prerelease candidate
        id: candidate-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-candidate
          if-no-files-found: error
          path: |
            output/release/build/api/
            output/release/build/worker/
            output/release/build/web/
            output/release/build/iac/
            output/release/build/public-config.json
          retention-days: 30
      - name: Freeze uploaded prerelease identity without a tag or rebuild
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.candidate-artifact.outputs.artifact-id }}
          SOURCE_ARTIFACT_SHA256: ${{ steps.candidate-artifact.outputs.artifact-digest }}
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_ARTIFACT_ID}" =~ ^[0-9]{1,20}$ ]]
          [[ "${SOURCE_ARTIFACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          pnpm release:manifest -- --scope prerelease --freeze-existing --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}" --source-artifact-id "${SOURCE_ARTIFACT_ID}" --source-artifact-sha256 "${SOURCE_ARTIFACT_SHA256}"
          pnpm release:scan -- --scope prerelease --pre-upload "${STAGE7_EVIDENCE_ROOT}/candidate-manifest.json"
      - name: Preserve immutable prerelease manifest separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-candidate-manifest
          if-no-files-found: error
          path: output/evidence/runtime/stage-7-prerelease/candidate-manifest.json
          retention-days: 30

  integrity-security:
    name: 04 Integrity, provenance and secret scan
    if: ${{ github.run_attempt == 1 }}
    needs: build-once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history at the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable prerelease candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate
          path: .stage7/candidate
      - name: Download the immutable prerelease manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify frozen content, provenance and sanitized boundary
        run: |
          set -euo pipefail
          pnpm release:manifest -- --scope prerelease --verify-artifact .stage7/candidate --manifest .stage7/candidate-manifest/candidate-manifest.json --inventory --provenance
          pnpm release:scan -- --scope prerelease --candidate .stage7/candidate --history --synthetic-only
      - name: Preserve sanitized integrity and security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-integrity-security
          if-no-files-found: error
          path: |
            output/evidence/runtime/stage-7-prerelease/checksums-sbom.json
            output/evidence/runtime/stage-7-prerelease/security.json
          retention-days: 30

  infra-synth-test:
    name: 05 Test and verify frozen IaC offline
    if: ${{ github.run_attempt == 1 }}
    needs: integrity-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable prerelease candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate
          path: .stage7/candidate
      - name: Download the immutable prerelease manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_PRERELEASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Verify prerelease synthesis without cloud credentials
        run: |
          set -euo pipefail
          pnpm infra:test
          pnpm infra:synth:release -- --scope prerelease --initial-release --verify .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json
          pnpm release:scan -- --scope prerelease --cloud-assembly .stage7/candidate/iac
      - name: Preserve sanitized prerelease IaC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prerelease-infra-synth
          if-no-files-found: error
          path: output/evidence/runtime/stage-7-prerelease/infra-synth.json
          retention-days: 30

  infra-diff:
    name: 06 Read-only AWS identity and IaC diff
    if: ${{ github.run_attempt == 1 }}
    needs: infra-synth-test
    environment: assessment-prerelease-read
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable prerelease candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate
          path: .stage7/candidate
      - name: Download the immutable prerelease manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-prerelease-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_PRERELEASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Assume the allowlisted read role after config validation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7pre-${{ github.job }}-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_PRERELEASE_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Produce sanitized prerelease plan and diff without deployment
        run: |
          set -euo pipefail
          pnpm release:preflight -- --scope prerelease --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --evidence "${STAGE7_EVIDENCE_ROOT}/aws-auth.json" --no-write --require-e6-conditional-go
          pnpm release:plan -- --scope prerelease --cloud-assembly .stage7/candidate/iac
          pnpm infra:diff:release -- --scope prerelease --initial-release --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json
      - name: Scan the prerelease plan and exact raw diff before review upload
        run: pnpm release:scan -- --scope prerelease --pre-upload "${STAGE7_EVIDENCE_ROOT}/release-plan.json" "${STAGE7_EVIDENCE_ROOT}/infra-diff.json" "${STAGE7_EVIDENCE_ROOT}/infra-diff.txt"
      - name: Publish the exact protected-review confirmation
        run: |
          set -euo pipefail
          diff_sha="$(sha256sum "${STAGE7_EVIDENCE_ROOT}/infra-diff.txt" | cut -d ' ' -f 1)"
          [[ "${diff_sha}" =~ ^[0-9a-f]{64}$ ]]
          printf 'Review the exact infrastructure diff, then approve the assessment-prerelease environment with this exact comment: `%s`\n' "STAGE7_IAM_DIFF_REVIEWED_SHA256=${diff_sha}" >> "${GITHUB_STEP_SUMMARY}"
