        run: pnpm release:preflight -- --aws-deploy --manifest .stage7/candidate-manifest/candidate-manifest.json --approved-environment
      - name: Activate the initial candidate only after observability is confirmed
        run: pnpm release:activate -- --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --api-record .stage7/api/api.json --web-record .stage7/web/web.json --seed-evidence .stage7/data/data.json --observability-evidence "${STAGE7_EVIDENCE_ROOT}/observability.json" --initial-release
      - name: Re-assume the allowlisted read role after activation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
