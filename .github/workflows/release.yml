      - name: Resolve the pinned runtime and lifecycle identities
        run: |
          set -euo pipefail
          aws_cli_version="$(node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync('.stage7/candidate-manifest/candidate-manifest.json','utf8')); if(typeof value?.toolchain?.awsCli!=='string') process.exit(1); process.stdout.write(value.toolchain.awsCli);")"
          lifecycle_sha="$(node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync('.stage7/rollback-resilience/stage7-rollback-resilience-complete.json','utf8')); if(!/^[0-9a-f]{64}$/.test(value?.journalLifecycleSha256??'')) process.exit(1); process.stdout.write(value.journalLifecycleSha256);")"
