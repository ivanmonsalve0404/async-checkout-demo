      - name: Publish the exact protected-review confirmation
        run: |
          set -euo pipefail
          diff_sha="$(sha256sum "${STAGE7_EVIDENCE_ROOT}/infra-diff.txt" | cut -d ' ' -f 1)"
          [[ "${diff_sha}" =~ ^[0-9a-f]{64}$ ]]
          printf 'Review the exact infrastructure diff, then approve the assessment-release environment with this exact comment: `%s`\n' "STAGE7_IAM_DIFF_REVIEWED_SHA256=${diff_sha}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve the informational pre-diff release plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-release-plan
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/release-plan.json
          retention-days: 30
      - name: Preserve the exact sanitized diff for protected review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-infra-diff
