      - name: Preserve sanitized sandbox evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-sandbox
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/sandbox-smoke.json
