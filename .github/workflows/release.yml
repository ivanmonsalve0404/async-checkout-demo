          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"ReadOwnRoleDefinition","Effect":"Allow","Action":["iam:GetRole","iam:GetRolePolicy","iam:ListAttachedRolePolicies","iam:ListRolePolicies"],"Resource":"${{ env.STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN }}"},{"Sid":"ReadExactBoundary","Effect":"Allow","Action":["iam:GetPolicy","iam:GetPolicyVersion"],"Resource":"${{ env.STAGE7_RELEASE_JOURNAL_CLEANUP_PERMISSIONS_BOUNDARY_ARN }}"},{"Sid":"ReadCallerIdentity","Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"},{"Sid":"ReadExactImmutableFence","Effect":"Allow","Action":"ssm:GetParameter","Resource":"arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/release-fence/${{ inputs.candidate_sha }}/${{ github.run_id }}"},{"Sid":"WriteExactImmutableFence","Effect":"Allow","Action":"ssm:PutParameter","Resource":"arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/release-fence/${{ inputs.candidate_sha }}/${{ github.run_id }}","Condition":{"StringEquals":{"ssm:Overwrite":"false"}}}]}
          mask-aws-account-id: true
