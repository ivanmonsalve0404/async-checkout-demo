          pnpm release:smoke -- --scope full --post-versioned-repromotion --previous-manifest .stage7/previous/previous-release-manifest.json --candidate-record .stage7/recovery-probe/versioned-rollback-candidate.json --rollback-evidence "${STAGE7_EVIDENCE_ROOT}/rollback.json" --transition "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-aws-transition.json" --manifest .stage7/candidate-manifest/candidate-manifest.json --evidence "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-smoke.json"
          node scripts/stage7/aws-ops.mjs finalize-versioned-rollback --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --candidate-record .stage7/recovery-probe/versioned-rollback-candidate.json --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json --transition "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-aws-transition.json" --smoke-evidence "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-smoke.json" --output "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-checkpoint.json"
      - name: Close the pending provider egress ledger with N-1 status evidence
