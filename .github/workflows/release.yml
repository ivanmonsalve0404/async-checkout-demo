            ROLLBACK_FILE="${STAGE7_EVIDENCE_ROOT}/rollback.json" node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync(process.env.ROLLBACK_FILE,'utf8')); const rehearsal=value.checkpoints?.versionedRollbackRehearsal; if(value.status!=='BLOCKED_REQUIRED_SCENARIOS'||rehearsal?.kind!=='VERSIONED_ROLLBACK_REHEARSAL'||rehearsal?.status!=='BLOCKED_REQUIRED_SCENARIOS'||JSON.stringify(rehearsal?.pendingScenarioIds)!==JSON.stringify(['RB-E7-06','RB-E7-08'])||rehearsal?.rollbackCheckpointSha256!==value.checkpoints?.rollbackCheckpoint?.checkpointSha256||rehearsal?.repromotionCheckpointSha256!==value.checkpoints?.repromotionCheckpoint?.checkpointSha256) process.exit(1);"
