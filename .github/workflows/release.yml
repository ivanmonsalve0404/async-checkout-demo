name: Stage 7 Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA already approved for release
        required: true
        type: string
      release_tag:
        description: Existing immutable final or release-candidate tag (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
      release_id:
        description: Release identifier (rel-YYYYMMDD-HHMM-sha7)
        required: true
        type: string
      versioned_update:
        description: Confirm this release updates the exact immutable N-1 baseline
        required: true
        default: false
        type: boolean
      config_sha256:
        description: SHA-256 of the approved STAGE7_CONFIG_B64 payload
        required: true
        type: string
      stage6_run_id:
        description: Exact successful Stage 6 workflow run containing the candidate evidence
        required: true
        type: string
      stage6_manifest_sha256:
        description: SHA-256 of the Stage 6 closeout manifest from that run
        required: true
        type: string
      baseline_run_id:
        description: Exact successful baseline workflow run containing stage7-previous-release
        required: true
        type: string
      baseline_bundle_sha256:
        description: Canonical SHA-256 declared by the immutable baseline bundle index
        required: true
        type: string
      baseline_artifact_id:
        description: Exact GitHub artifact ID for stage7-previous-release in the baseline run
        required: true
        type: string
      baseline_artifact_digest:
        description: Exact GitHub artifact digest in sha256:hex form
        required: true
        type: string
      confirm_deploy:
        description: Confirm that the protected-environment approval may deploy
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stage7-assessment-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.19.0'
  STAGE7_AWS_ACCOUNT_ID: ${{ vars.STAGE7_AWS_ACCOUNT_ID }}
  STAGE7_AWS_REGION: ${{ vars.STAGE7_AWS_REGION }}
  STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  STAGE7_ENVIRONMENT: assessment-release
  STAGE7_EVIDENCE_ROOT: output/evidence/runtime/stage-7
  STAGE7_RELEASE_JOURNAL_CLEANUP_PERMISSIONS_BOUNDARY_ARN: ${{ vars.STAGE7_RELEASE_JOURNAL_CLEANUP_PERMISSIONS_BOUNDARY_ARN }}
  STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN: ${{ vars.STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN }}
  STAGE7_RELEASE_RECONCILIATION_RECOVERY_PERMISSIONS_BOUNDARY_ARN: ${{ vars.STAGE7_RELEASE_RECONCILIATION_RECOVERY_PERMISSIONS_BOUNDARY_ARN }}
  STAGE7_RELEASE_RECONCILIATION_RECOVERY_ROLE_ARN: ${{ vars.STAGE7_RELEASE_RECONCILIATION_RECOVERY_ROLE_ARN }}
  STAGE7_RELEASE_ID: ${{ inputs.release_id }}
  STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  release-metadata:
    name: 01 Release metadata
    if: >-
      github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'ivanmonsalve0404/async-checkout-demo'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Validate immutable release identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSIONED_UPDATE: ${{ inputs.versioned_update }}
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE6_RUN_ID: ${{ inputs.stage6_run_id }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          [[ "${RELEASE_ID}" =~ ^rel-[0-9]{8}-[0-9]{4}-[0-9a-f]{7}$ ]]
          [[ "${STAGE6_RUN_ID}" =~ ^[0-9]{1,20}$ ]]
          [[ "${STAGE6_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${VERSIONED_UPDATE}" = 'true'
          test "${RELEASE_ID##*-}" = "${CANDIDATE_SHA:0:7}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/master)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${CANDIDATE_SHA}"
          test "${GITHUB_REF}" = 'refs/heads/master'
          test "${GITHUB_REPOSITORY}" = 'ivanmonsalve0404/async-checkout-demo'
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Stage 7 metadata and entry gate
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:preflight -- --local-only --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}" --evidence "${STAGE7_EVIDENCE_ROOT}/release-metadata.json"
      - name: Preserve the exact validated Stage 6 closeout bytes
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
        run: |
          set -euo pipefail
          mapfile -d '' matches < <(find .stage7/stage6 -type f -name closeout.json -print0)
          test "${#matches[@]}" -eq 1
          cp -- "${matches[0]}" "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json"
          test "$(sha256sum "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json" | cut -d ' ' -f 1)" = "${STAGE6_MANIFEST_SHA256}"
          pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/stage6-closeout.json"
      - name: Preserve sanitized release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-release-metadata
          if-no-files-found: error
          path: |
            output/evidence/runtime/stage-7/release-metadata.json
            output/evidence/runtime/stage-7/stage6-closeout.json
          retention-days: 30

  verify-candidate:
    name: 02 Verify candidate
    if: ${{ github.run_attempt == 1 }}
    needs: release-metadata
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Revalidate the exact candidate and strict Stage 6 gate
        env:
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:verify-candidate -- --scope full --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}"
      - name: Preserve sanitized verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-candidate-verification
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/verify-candidate.json
          retention-days: 30

  build-or-fetch:
    name: 03 Build or fetch immutable artifacts
    if: ${{ github.run_attempt == 1 }}
    needs: verify-candidate
    environment: assessment-release-read
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the exact Stage 6 evidence source
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verification-reports
          path: .stage7/stage6
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage6_run_id }}
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Build and package the application once without cloud credentials
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${AWS_SECURITY_TOKEN:-}"
          pnpm build
          pnpm release:build
      - name: Assume the allowlisted read role for pre-freeze synthesis
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-prefreeze-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Bind the exceptional read-only pre-freeze authority
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          pnpm release:preflight -- --aws-read --pre-freeze-synth --approved-environment --no-write --evidence "${STAGE7_EVIDENCE_ROOT}/prefreeze.json"
          pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/prefreeze.json"
      - name: Preserve sanitized pre-freeze read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-prefreeze
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/prefreeze.json
          retention-days: 30
      - name: Synthesize the frozen infrastructure under bounded read authority
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm infra:synth:release -- --versioned-update --output output/release/build/iac
      - name: Remove the temporary AWS credentials before scanning and freezing
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          {
            printf 'AWS_ACCESS_KEY_ID=\n'
            printf 'AWS_SECRET_ACCESS_KEY=\n'
            printf 'AWS_SESSION_TOKEN=\n'
            printf 'AWS_SECURITY_TOKEN=\n'
          } >> "${GITHUB_ENV}"
      - name: Scan the candidate only after cloud credentials are removed
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${AWS_SECURITY_TOKEN:-}"
          pnpm release:scan -- --pre-upload output/release/build/api output/release/build/worker output/release/build/web output/release/build/iac output/release/build/public-config.json
      - name: Preserve immutable candidate artifacts
        id: candidate-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-candidate
          if-no-files-found: error
          path: |
            output/release/build/api/
            output/release/build/worker/
            output/release/build/web/
            output/release/build/iac/
            output/release/build/public-config.json
          retention-days: 30
      - name: Freeze the uploaded artifact identity without rebuilding
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.candidate-artifact.outputs.artifact-id }}
          SOURCE_ARTIFACT_SHA256: ${{ steps.candidate-artifact.outputs.artifact-digest }}
          STAGE6_MANIFEST_SHA256: ${{ inputs.stage6_manifest_sha256 }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_ARTIFACT_ID}" =~ ^[0-9]{1,20}$ ]]
          [[ "${SOURCE_ARTIFACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          pnpm release:manifest -- --freeze-existing --stage6-evidence .stage7/stage6 --stage6-manifest-sha256 "${STAGE6_MANIFEST_SHA256}" --source-artifact-id "${SOURCE_ARTIFACT_ID}" --source-artifact-sha256 "${SOURCE_ARTIFACT_SHA256}" --pre-freeze-evidence "${STAGE7_EVIDENCE_ROOT}/prefreeze.json" --tag "${STAGE7_RELEASE_TAG}"
          pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/candidate-manifest.json"
      - name: Preserve the immutable candidate manifest separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-candidate-manifest
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/candidate-manifest.json
          retention-days: 30

  checksums-sbom:
    name: 04 Checksums, inventory and provenance
    if: ${{ github.run_attempt == 1 }}
    needs: build-or-fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate
          path: .stage7/candidate
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify checksums and emit dependency inventory and provenance
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:manifest -- --verify-artifact .stage7/candidate --manifest .stage7/candidate-manifest/candidate-manifest.json --inventory --provenance
      - name: Preserve sanitized integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-integrity
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/checksums-sbom.json
          retention-days: 30

  secret-scan:
    name: 05 Secret scan
    if: ${{ github.run_attempt == 1 }}
    needs: checksums-sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history at the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate
          path: .stage7/candidate
      - name: Download integrity evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-integrity
          path: .stage7/integrity
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan tree, history, builds, manifest and provider boundary
        run: pnpm release:scan -- --candidate .stage7/candidate --integrity .stage7/integrity
      - name: Preserve sanitized security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-security
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/security.json
          retention-days: 30

  aws-auth:
    name: 06 AWS read-only identity
    if: ${{ github.run_attempt == 1 }}
    needs: secret-scan
    environment: assessment-release-read
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Assume the allowlisted read role for exact auxiliary-role audit
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
