  rollback-resilience:
    name: 21 Protected rollback resilience
    if: ${{ github.run_attempt == 1 && needs.rollback-check.outputs.base_rehearsal_ready == 'true' }}
    needs: rollback-check
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage7-rollback-resilience.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      config_sha256: ${{ inputs.config_sha256 }}
      release_id: ${{ inputs.release_id }}

  release-reconciliation:
    name: 22 Reconcile the exact candidate before publication
    if: ${{ always() && github.run_attempt == 1 && needs.release-reconciliation-intent.result == 'success' }}
    needs:
      - release-reconciliation-intent
      - rollback-check
      - rollback-resilience
    environment: assessment-release
    env:
      STAGE7_AWS_ROLLBACK_ROLE_ARN: ${{ vars.STAGE7_AWS_ROLLBACK_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
