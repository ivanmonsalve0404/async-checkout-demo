          node scripts/stage7/aws-ops.mjs validate-previous-release --config "${STAGE7_CONFIG}" --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-source-provenance .stage7/previous/previous-source-provenance.json --previous-target-compatibility .stage7/previous/previous-target-compatibility.json --previous-final-disable-provenance .stage7/previous/previous-final-disable-provenance.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --previous-release-projection-index .stage7/previous/previous-release-projection-index.json --output "${STAGE7_EVIDENCE_ROOT}/previous-release-readiness.json"
