            output/evidence/runtime/stage-7/external-authorization-request.json
          retention-days: 30
      - name: Explain the protected full-release authorization handoff
        run: |
          set -euo pipefail
          printf '%s\n' 'Download stage7-web and review external-authorization-request.json while the API mapping, CloudFront distribution and scheduler remain disabled.' 'Create the exact fresh AUTH-E7-EXT-01/02/03 bundle for this full-release origin, base64-encode it into STAGE7_EXTERNAL_AUTHORIZATIONS_B64, confirm the SNS email subscription, then approve postdeploy-smoke.' 'Without both matching authorization and confirmed observability, activation and all target traffic remain blocked.' >> "${GITHUB_STEP_SUMMARY}"

  postdeploy-smoke:
