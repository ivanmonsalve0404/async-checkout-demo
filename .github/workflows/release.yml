          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate read authority immediately before target verification
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --no-write
      - name: Run all 18 low-volume deployed smoke cases
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
