        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Download the immutable candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate
          path: .stage7/candidate
      - name: Download the immutable N-1 recovery contract for activation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-previous-release
          path: .stage7/previous
      - name: Download the exact reviewed infrastructure diff for activation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-infra-diff
          path: .stage7/infra-diff
      - name: Download the exact protected approval for activation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-approval
          path: .stage7/approval
      - name: Download the exact AWS authority bundle for activation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-aws-auth
          path: .stage7/aws-auth
      - name: Download the API activation checkpoint
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-api
          path: .stage7/api
      - name: Download the web activation checkpoint
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-web
          path: .stage7/web
      - name: Download the exact external authorization review request
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-external-authorization-request
          path: .stage7/web
      - name: Download the seed checkpoint
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-data
          path: .stage7/data
      - name: Download pending observability evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-observability-pending
          path: .stage7/observability-pending
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Materialize and bind fresh full-release external authorization
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_EXTERNAL_AUTHORIZATIONS_B64: ${{ vars.STAGE7_EXTERNAL_AUTHORIZATIONS_B64 }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage7-external-authorizations.json"
          printf '%s' "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          export STAGE7_EXTERNAL_AUTHORIZATIONS="${target}"
          pnpm release:preflight -- --scope full --external-authorization .stage7/web --approved-environment --evidence "${STAGE7_EVIDENCE_ROOT}/external-authorization.json"
          pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/external-authorization.json"
          printf 'STAGE7_EXTERNAL_AUTHORIZATIONS=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Preserve sanitized full-release authorization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-external-authorization
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/external-authorization.json
          retention-days: 30
      - name: Assume the allowlisted read role to verify observability
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-observe-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate read authority before observability verification
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --no-write
      - name: Prove the exact alarm email subscription is confirmed
        run: pnpm release:verify:observability -- --record .stage7/observability-pending/observability.json
      - name: Preserve confirmed observability readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-observability
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/observability.json
          retention-days: 30
      - name: Materialize private full-release smoke inputs before activation
        env:
          STAGE7_SMOKE_INPUTS_B64: ${{ secrets.STAGE7_SMOKE_INPUTS_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_SMOKE_INPUTS_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage7-private-smoke-inputs.json"
          printf '%s' "${STAGE7_SMOKE_INPUTS_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          SMOKE_INPUTS_PATH="${target}" node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync(process.env.SMOKE_INPUTS_PATH, 'utf8'));"
          printf 'STAGE7_SMOKE_INPUTS=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Validate private smoke binding locally before candidate activation
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_PROTECTED_ENVIRONMENT: assessment-release
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          pnpm release:preflight -- --scope full --smoke-inputs --manifest .stage7/candidate-manifest/candidate-manifest.json --deployment .stage7/web --approved-environment --evidence "${STAGE7_EVIDENCE_ROOT}/smoke-input-preflight.json"
          pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/smoke-input-preflight.json"
      - name: Assume the allowlisted deploy role only after observability is confirmed
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-activate-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_DEPLOY_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate deploy authority immediately before activation
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: pnpm release:preflight -- --aws-deploy --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-environment
      - name: Activate the versioned candidate only after observability is confirmed
        run: pnpm release:activate -- --versioned-update --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --api-record .stage7/api/api.json --web-record .stage7/web/web.json --seed-evidence .stage7/data/data.json --observability-evidence "${STAGE7_EVIDENCE_ROOT}/observability.json" --plan .stage7/infra-diff/infra-diff.json --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json
      - name: Seal the activation checkpoint before any downstream verification
        run: pnpm release:scan -- --pre-upload "${STAGE7_EVIDENCE_ROOT}/activation.json"
      - name: Hand off the activation checkpoint for fail-closed recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-activation
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/activation.json
          retention-days: 7
      - name: Mark the successfully uploaded activation checkpoint
        id: activation-seal
        run: printf 'activation_sealed=true\n' >> "${GITHUB_OUTPUT}"
      - name: Re-assume the allowlisted read role after activation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-smoke-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate read authority immediately before target verification
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --no-write
      - name: Run all 18 low-volume deployed smoke cases
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:smoke -- --scope full --manifest .stage7/candidate-manifest/candidate-manifest.json
      - name: Preserve sanitized smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-smoke
          if-no-files-found: error
          path: |
            output/evidence/runtime/stage-7/smoke-input-preflight.json
            output/evidence/runtime/stage-7/smoke.json
          retention-days: 30

  edge-security:
    name: 15 Edge security
    if: ${{ github.run_attempt == 1 }}
    needs: postdeploy-smoke
    environment: assessment-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Download the immutable candidate for passive edge verification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate
          path: .stage7/candidate
      - name: Download the exact AWS authority bundle for passive edge verification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-aws-auth
          path: .stage7/aws-auth
      - name: Download the exact authorized web target
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-web
          path: .stage7/web
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Rebind fresh authorization before any edge target traffic
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_EXTERNAL_AUTHORIZATIONS_B64: ${{ vars.STAGE7_EXTERNAL_AUTHORIZATIONS_B64 }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage7-external-authorizations.json"
          printf '%s' "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          export STAGE7_EXTERNAL_AUTHORIZATIONS="${target}"
          pnpm release:preflight -- --scope full --external-authorization .stage7/web --approved-environment
          printf 'STAGE7_EXTERNAL_AUTHORIZATIONS=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Assume the allowlisted read role through OIDC after config validation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-${{ github.job }}-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate AWS identity before passive checks
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --no-write
      - name: Capture passive ZAP evidence with the pinned scanner image
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/zap-target"
          inventory="${RUNNER_TEMP}/zap-passive-inventory.json"
          report="${RUNNER_TEMP}/zap-passive-report.json"
          capture="${RUNNER_TEMP}/zap-passive-capture.json"
          request_count_file="${RUNNER_TEMP}/zap-request-count.txt"
          pnpm release:scan -- --scope full --prepare-zap-target "${target}"
          node scripts/stage7/zap-passive-inventory.mjs create --target-file "${target}" --openapi output/architecture/openapi.yaml --output "${inventory}"
          node scripts/stage7/zap-passive-capture.mjs --target-file "${target}" --inventory "${inventory}" --report "${report}" --count "${request_count_file}" --capture "${capture}" --rules scripts/stage7/zap-passive-rules.tsv --image-digest zaproxy/zap-stable@sha256:51dbcc578b217ea7563b22a6948f5f41dd2002936fc5148300077f988663b4aa
          request_count="$(tr -d '\r\n' < "${request_count_file}")"
          test "${request_count}" = '6'
          printf 'STAGE7_ZAP_INVENTORY=%s\n' "${inventory}" >> "${GITHUB_ENV}"
          printf 'STAGE7_ZAP_REPORT=%s\n' "${report}" >> "${GITHUB_ENV}"
          printf 'STAGE7_ZAP_CAPTURE=%s\n' "${capture}" >> "${GITHUB_ENV}"
          printf 'STAGE7_ZAP_REQUEST_COUNT=%s\n' "${request_count}" >> "${GITHUB_ENV}"
          printf 'STAGE7_ZAP_RULESET=%s\n' "${GITHUB_WORKSPACE}/scripts/stage7/zap-passive-rules.tsv" >> "${GITHUB_ENV}"
          printf 'STAGE7_ZAP_VERSION=2.16.1\n' >> "${GITHUB_ENV}"
      - name: Verify TLS, headers, exact CORS, private S3 and passive DAST
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
        run: pnpm release:scan -- --scope full --deployed-edge --headers --zap-passive-only --passive-only
      - name: Preserve sanitized edge evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-edge-security
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/edge-security.json
          retention-days: 30

  quality:
    name: 16 Cross-browser, accessibility and performance quality
    if: ${{ github.run_attempt == 1 }}
    needs: edge-security
