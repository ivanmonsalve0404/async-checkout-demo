          plan='output/release/publication/publication-plan.json'
          readme='output/release/publication/README.md'
          notes='output/release/publication/release-notes.md'
          manifest='output/release/publication/candidate-manifest.json'
          test -s "${plan}"
          test -s "${readme}"
          test -s "${notes}"
          test -s "${manifest}"
          remote_master="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          remote_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${STAGE7_RELEASE_TAG}" --jq '.object.sha')"
          test "${remote_master}" = "${STAGE7_CANDIDATE_SHA}"
          test "${remote_tag}" = "${STAGE7_CANDIDATE_SHA}"
          if gh release view "${STAGE7_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            exit 1
          fi
          request="${RUNNER_TEMP}/stage7-readme-update.json"
          response="${RUNNER_TEMP}/stage7-readme-response.json"
          umask 077
          PUBLICATION_PLAN="${plan}" PUBLICATION_README="${readme}" REQUEST_FILE="${request}" node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.env.PUBLICATION_PLAN,'utf8')); const content=fs.readFileSync(process.env.PUBLICATION_README).toString('base64'); fs.writeFileSync(process.env.REQUEST_FILE,JSON.stringify({message:'docs: publish '+p.releaseTag,content,branch:'master',sha:p.expectedReadmeGitBlobSha}),{mode:0o600});"
          chmod 600 "${request}"
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/README.md" --input "${request}" > "${response}"
          PUBLICATION_PLAN="${plan}" PUBLICATION_RESPONSE="${response}" CANDIDATE_SHA="${STAGE7_CANDIDATE_SHA}" node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.env.PUBLICATION_PLAN,'utf8')); const r=JSON.parse(fs.readFileSync(process.env.PUBLICATION_RESPONSE,'utf8')); if(r.content?.sha!==p.desiredReadmeGitBlobSha||r.commit?.parents?.[0]?.sha!==process.env.CANDIDATE_SHA||!/^[0-9a-f]{40}$/.test(r.commit?.sha??'')) process.exit(1);"
          gh release create "${STAGE7_RELEASE_TAG}" "${manifest}#candidate-manifest.json" --repo "${GITHUB_REPOSITORY}" --verify-tag --target "${STAGE7_CANDIDATE_SHA}" --title "${STAGE7_RELEASE_TAG}" --notes-file "${notes}" --prerelease > "${RUNNER_TEMP}/stage7-release-url.txt"
          pnpm release:verify -- --publication-native "${plan}" --evidence "${STAGE7_EVIDENCE_ROOT}/publication-proof.json" --external-writes-performed 2
          pnpm release:scan -- --pre-upload output/release/publication "${STAGE7_EVIDENCE_ROOT}/publication.json" "${STAGE7_EVIDENCE_ROOT}/publication-proof.json"
      - name: Preserve the verified publication package and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-publication
          if-no-files-found: error
          path: |
            output/release/publication/README.md
            output/release/publication/release-notes.md
            output/release/publication/publication-plan.json
            output/evidence/runtime/stage-7/publication.json
            output/evidence/runtime/stage-7/publication-proof.json
          retention-days: 30

  summary:
    name: 20 Release summary and gates
    if: ${{ always() }}
    needs:
      - release-metadata
      - verify-candidate
      - build-or-fetch
      - checksums-sbom
      - secret-scan
      - aws-auth
      - infra-synth-test
      - infra-diff
      - approval
      - deploy-data
      - deploy-api
      - deploy-observability
      - deploy-web
      - postdeploy-smoke
      - edge-security
      - quality
      - sandbox-smoke
      - rollback-check
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download available sanitized Stage 7 evidence
        if: ${{ needs.release-metadata.result == 'success' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: stage7-*
          path: .stage7/evidence
          merge-multiple: true
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Consolidate all three Stage 7 gates fail-closed
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_JOB_RESULTS: ${{ toJSON(needs) }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:verify -- --evidence .stage7/evidence
      - name: Preserve sanitized Stage 7 closeout
        if: ${{ always() && hashFiles('output/evidence/runtime/stage-7/closeout.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-release-reports
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/closeout.json
          retention-days: 30
