e.json --previous-release-projection-index .stage7/previous/previous-release-projection-index.json --direction REPROMOTE_CANDIDATE --output "${STAGE7_EVIDENCE_ROOT}/versioned-repromotion-aws-transition.json"
      - name: Assume read authority for final N smoke
