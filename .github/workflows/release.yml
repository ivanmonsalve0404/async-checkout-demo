          request_sha="$(sha256sum "${request}" | cut -d ' ' -f 1)"
          pnpm release:scan -- --pre-upload "${request}"
          printf '%s\n' 'Sandbox request ready for the next protected job.' "Review sandbox-execution-request.json, then approve assessment-release-sandbox with this exact comment:" "STAGE7_SANDBOX_CLAIM_REQUEST_SHA256=${request_sha}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve sanitized quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-quality
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/quality.json
          retention-days: 30
      - name: Preserve the exact sandbox execution review request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sandbox-execution-request
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/sandbox-execution-request.json
          retention-days: 30

  sandbox-smoke:
    name: 17 Authorized sandbox smoke
    if: ${{ github.run_attempt == 1 }}
    needs: quality
    environment: assessment-release-sandbox
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Download the exact authorized web target
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-web
          path: .stage7/web
      - name: Download the exact sandbox execution approval request
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-sandbox-execution-request
          path: .stage7/quality
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Rebind fresh authorization before provider sandbox traffic
        env:
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_EXTERNAL_AUTHORIZATIONS_B64: ${{ vars.STAGE7_EXTERNAL_AUTHORIZATIONS_B64 }}
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage7-external-authorizations.json"
          printf '%s' "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          export STAGE7_EXTERNAL_AUTHORIZATIONS="${target}"
          pnpm release:preflight -- --scope full --external-authorization .stage7/web --approved-environment
          printf 'STAGE7_EXTERNAL_AUTHORIZATIONS=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Materialize the original one-use AUTH-E6-02 capability
        env:
          STAGE6_SANDBOX_AUTHORIZATION_B64: ${{ vars.STAGE6_SANDBOX_AUTHORIZATION_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE6_SANDBOX_AUTHORIZATION_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage6-sandbox-authorization.json"
          printf '%s' "${STAGE6_SANDBOX_AUTHORIZATION_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          AUTHORIZATION_PATH="${target}" node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_PATH, 'utf8'));"
          printf 'STAGE6_SANDBOX_AUTHORIZATION=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Verify protected approval and mint the exact one-use claim before credentials
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_PROTECTED_ENVIRONMENT: assessment-release-sandbox
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${AWS_SECURITY_TOKEN:-}"
          request="${GITHUB_WORKSPACE}/.stage7/quality/sandbox-execution-request.json"
          claim="${RUNNER_TEMP}/stage7-sandbox-execution-claim.capability.json"
          receipt="${RUNNER_TEMP}/stage7-sandbox-execution-claim.json"
          test -s "${request}"
          chmod 600 "${request}"
          test "$(stat -c '%a' "${request}")" = '600'
          test ! -e "${claim}"
          test ! -e "${receipt}"
          pnpm release:sandbox-claim -- --approve --scope full --request "${request}" --claim "${claim}" --receipt "${receipt}"
          chmod 600 "${claim}" "${receipt}"
          test "$(stat -c '%a' "${claim}")" = '600'
          chmod 600 "${receipt}"
          test "$(stat -c '%a' "${receipt}")" = '600'
          printf 'STAGE7_SANDBOX_EXECUTION_CLAIM=%s\n' "${claim}" >> "${GITHUB_ENV}"
          printf 'STAGE7_SANDBOX_CLAIM_RECEIPT=%s\n' "${receipt}" >> "${GITHUB_ENV}"
          printf 'STAGE7_SANDBOX_CLAIM_SCOPE=full\n' >> "${GITHUB_ENV}"
      - name: Assume the allowlisted verification role through OIDC after config validation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-${{ github.job }}-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate scoped sandbox authority immediately before execution
        env:
          CONFIRM_SANDBOX_SMOKE: 'true'
        run: pnpm release:preflight -- --scope full --sandbox-authorized --manifest .stage7/candidate-manifest/candidate-manifest.json --approved-environment
      - name: Execute one bounded sandbox smoke and verify idempotent effects
        env:
          CONFIRM_SANDBOX_SMOKE: 'true'
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE6_SANDBOX_CARD_CVC: ${{ secrets.STAGE6_SANDBOX_CARD_CVC }}
          STAGE6_SANDBOX_CARD_EXPIRY: ${{ secrets.STAGE6_SANDBOX_CARD_EXPIRY }}
          STAGE6_SANDBOX_CARD_HOLDER: ${{ secrets.STAGE6_SANDBOX_CARD_HOLDER }}
          STAGE6_SANDBOX_CARD_NUMBER: ${{ secrets.STAGE6_SANDBOX_CARD_NUMBER }}
          STAGE6_SANDBOX_CUSTOMER_EMAIL: ${{ secrets.STAGE6_SANDBOX_CUSTOMER_EMAIL }}
          STAGE6_SANDBOX_EXECUTION: EXECUTE_AUTH02_ONCE
          STAGE6_SANDBOX_FIXTURE_AUTHORIZED: 'YES'
          STAGE6_SANDBOX_INTEGRITY_SECRET: ${{ secrets.STAGE6_SANDBOX_INTEGRITY_SECRET }}
          STAGE6_SANDBOX_KILL_SWITCH: ARMED_AUTH02
          STAGE6_SANDBOX_MUTATION_LIMIT: '1'
          STAGE6_SANDBOX_ORIGIN: https://sandbox.wompi.co
          STAGE6_SANDBOX_PRIVATE_KEY: ${{ secrets.STAGE6_SANDBOX_PRIVATE_KEY }}
          STAGE6_SANDBOX_PUBLIC_KEY: ${{ secrets.STAGE6_SANDBOX_PUBLIC_KEY }}
          STAGE7_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE7_PROTECTED_ENVIRONMENT: assessment-release-sandbox
          STAGE7_RELEASE_ID: ${{ inputs.release_id }}
          STAGE7_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm release:sandbox-smoke -- --scope full --manifest .stage7/candidate-manifest/candidate-manifest.json --deployment .stage7/web --approved-environment
      - name: Preserve sanitized sandbox evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-sandbox
          if-no-files-found: error
          path: output/evidence/runtime/stage-7/sandbox-smoke.json
          retention-days: 30

  emergency-recovery:
    name: 18 Automatic durable recovery probe
    needs:
      - postdeploy-smoke
      - edge-security
      - quality
      - sandbox-smoke
    if: ${{ always() && github.run_attempt == 1 }}
    environment: assessment-release-recovery
    outputs:
      safe_for_rehearsal: ${{ steps.recovery-outcome.outputs.safe_for_rehearsal }}
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Attempt activation-ledger recovery as corroboration only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .stage7/activation
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "stage7-activation" and .expired == false) | .id' | head -n 1)"
          if test -n "${artifact_id}"; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/activation.zip"
            unzip -q "${RUNNER_TEMP}/activation.zip" -d .stage7/activation
          fi
      - name: Classify only the downstream signal, never AWS state
        id: downstream
        env:
          EDGE_RESULT: ${{ needs.edge-security.result }}
          POSTDEPLOY_RESULT: ${{ needs.postdeploy-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-smoke.result }}
        run: |
          set -euo pipefail
          healthy='false'
          if test "${POSTDEPLOY_RESULT}" = 'success' && test "${EDGE_RESULT}" = 'success' && test "${QUALITY_RESULT}" = 'success' && test "${SANDBOX_RESULT}" = 'success'; then healthy='true'; fi
          printf 'healthy=%s\n' "${healthy}" >> "${GITHUB_OUTPUT}"
      - name: Download the immutable candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate
          path: .stage7/candidate
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Download the exact reviewed infrastructure diff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-infra-diff
          path: .stage7/infra-diff
      - name: Download the exact protected approval binding
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-approval
          path: .stage7/approval
      - name: Download the exact read-only AWS authority evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-aws-auth
          path: .stage7/aws-auth
      - name: Download the durable web deployment checkpoint
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-web
          path: .stage7/web
      - name: Download the approved immutable N-1 recovery contract
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-previous-release
          path: .stage7/previous
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Revalidate the approved immutable N-1 recovery contract
        run: |
          set -euo pipefail
          for artifact in .stage7/previous/*.json; do test -s "${artifact}"; done
          node scripts/stage7/aws-ops.mjs validate-previous-release --config "${STAGE7_CONFIG}" --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --output "${STAGE7_EVIDENCE_ROOT}/previous-release-preflight.json"
      - name: Assume read authority for the immutable recovery observation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-emergency-observe-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate read authority before the immutable recovery observation
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-environment --no-write
      - name: Capture aliases and object versions from AWS before any recovery decision
        run: node scripts/stage7/aws-ops.mjs capture-rollback-candidate-aws --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json --web-record .stage7/web/web.json --output "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json"
      - name: Verify the healthy candidate with a stable read-only AWS sandwich
        id: emergency-no-action
        if: ${{ always() && steps.downstream.outputs.healthy == 'true' }}
        run: node scripts/stage7/aws-ops.mjs recover-versioned-release --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --candidate-record "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json --verify-candidate-active-no-action --outcome "${STAGE7_EVIDENCE_ROOT}/emergency-recovery-no-action-outcome.json" --output "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json"
      - name: Assume automatic rollback authority only for the unhealthy branch
        if: ${{ success() && steps.downstream.outputs.healthy != 'true' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 1800
          role-session-name: e7-emergency-recovery-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_ROLLBACK_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate automatic rollback authority before mutation
        if: ${{ success() && steps.downstream.outputs.healthy != 'true' }}
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: pnpm release:preflight -- --aws-rollback --manifest .stage7/candidate-manifest/candidate-manifest.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-environment
      - name: Recover N-1 from durable AWS state only for the unhealthy branch
        id: emergency-recovery-mutation
        if: ${{ success() && steps.downstream.outputs.healthy != 'true' }}
        run: node scripts/stage7/aws-ops.mjs recover-versioned-release --app .stage7/candidate/iac --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --candidate-record "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json --recover-if-active --output "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json"
      - name: Publish the exact emergency decision for downstream gates
        id: emergency-recovery
        if: ${{ always() }}
        run: |
          set -euo pipefail
          decision='EMERGENCY_RECOVERY_FAILED'
          if test -s "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json"; then
            decision="$(RECOVERY_FILE="${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync(process.env.RECOVERY_FILE,'utf8')); process.stdout.write(value.decision);")"
          elif test -s "${STAGE7_EVIDENCE_ROOT}/emergency-recovery-no-action-outcome.json"; then
            decision="$(RECOVERY_FILE="${STAGE7_EVIDENCE_ROOT}/emergency-recovery-no-action-outcome.json" node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync(process.env.RECOVERY_FILE,'utf8')); process.stdout.write(value.decision);")"
          fi
          printf 'decision=%s\n' "${decision}" >> "${GITHUB_OUTPUT}"
      - name: Materialize authorization only after an emergency mutation
        if: ${{ steps.emergency-recovery.outputs.decision == 'RECOVERED_TO_PREVIOUS_REQUIRES_READ_SMOKE' }}
        env:
          STAGE7_EXTERNAL_AUTHORIZATIONS_B64: ${{ vars.STAGE7_EXTERNAL_AUTHORIZATIONS_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}"
          umask 077
          target="${RUNNER_TEMP}/stage7-external-authorizations.json"
          printf '%s' "${STAGE7_EXTERNAL_AUTHORIZATIONS_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          export STAGE7_EXTERNAL_AUTHORIZATIONS="${target}"
          pnpm release:preflight -- --scope full --external-authorization .stage7/web --approved-environment --evidence "${STAGE7_EVIDENCE_ROOT}/recovery-external-authorization.json"
          printf 'STAGE7_EXTERNAL_AUTHORIZATIONS=%s\n' "${target}" >> "${GITHUB_ENV}"
      - name: Assume read authority only for post-recovery HTTP verification
        if: ${{ steps.emergency-recovery.outputs.decision == 'RECOVERED_TO_PREVIOUS_REQUIRES_READ_SMOKE' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 900
          role-session-name: e7-emergency-read-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGE7_AWS_READ_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate read authority before post-recovery smoke
        if: ${{ steps.emergency-recovery.outputs.decision == 'RECOVERED_TO_PREVIOUS_REQUIRES_READ_SMOKE' }}
        run: pnpm release:preflight -- --aws-read --manifest .stage7/candidate-manifest/candidate-manifest.json --cloud-assembly .stage7/candidate/iac --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --no-write
      - name: Verify emergency N-1 recovery from READ authority
        if: ${{ steps.emergency-recovery.outputs.decision == 'RECOVERED_TO_PREVIOUS_REQUIRES_READ_SMOKE' }}
        run: pnpm release:smoke -- --scope full --post-versioned-rollback --previous-manifest .stage7/previous/previous-release-manifest.json --candidate-record "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" --rollback-evidence "${STAGE7_EVIDENCE_ROOT}/rollback.json" --emergency-recovery "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" --manifest .stage7/candidate-manifest/candidate-manifest.json --evidence "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-smoke.json"
      - name: Publish a fail-closed recovery outcome
        id: recovery-outcome
        if: ${{ always() }}
        env:
          DOWNSTREAM_HEALTHY: ${{ steps.downstream.outputs.healthy }}
          NO_ACTION_RESULT: ${{ steps.emergency-no-action.outcome }}
          RECOVERY_DECISION: ${{ steps.emergency-recovery.outputs.decision }}
        run: |
          set -euo pipefail
          safe='false'
          if test "${DOWNSTREAM_HEALTHY}" = 'true' && test "${NO_ACTION_RESULT}" = 'success' && test "${RECOVERY_DECISION}" = 'NO_ACTION_CANDIDATE_ACTIVE_VERIFIED' && test -s "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" && test -s "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" && test -s "${STAGE7_EVIDENCE_ROOT}/emergency-recovery-no-action-outcome.json"; then
            node scripts/stage7/aws-ops.mjs verify-emergency-recovery-no-action-outcome --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json --previous-pending-evidence .stage7/previous/previous-pending-evidence.json --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json --candidate-record "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" --approval .stage7/approval/approval.json --aws-auth .stage7/aws-auth/aws-auth.json --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json --reconciliation-recovery-role-effective-permissions .stage7/aws-auth/stage7-release-reconciliation-recovery-role-effective-permissions.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json --emergency-recovery "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" --outcome "${STAGE7_EVIDENCE_ROOT}/emergency-recovery-no-action-outcome.json"
            pnpm release:verify -- --emergency-recovery-no-action --manifest .stage7/candidate-manifest/candidate-manifest.json --previous-manifest .stage7/previous/previous-release-manifest.json --candidate-record "${STAGE7_EVIDENCE_ROOT}/versioned-rollback-candidate.json" --emergency-recovery "${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" --approval .stage7/approval/approval.json --approved-plan .stage7/infra-diff/infra-diff.json --deployment-evidence .stage7/web/web.json
            recovery_decision="$(RECOVERY_FILE="${STAGE7_EVIDENCE_ROOT}/emergency-recovery.json" node --input-type=module -e "import fs from 'node:fs'; const value=JSON.parse(fs.readFileSync(process.env.RECOVERY_FILE,'utf8')); process.stdout.write(value.decision);")"
            test "${recovery_decision}" = 'NO_ACTION_CANDIDATE_ACTIVE_VERIFIED'
            safe='true'
          fi
          printf 'safe_for_rehearsal=%s\n' "${safe}" >> "${GITHUB_OUTPUT}"
      - name: Scan the exact automatic recovery evidence before preservation
        if: ${{ always() }}
        run: |
          set -euo pipefail
          files=()
          for filename in versioned-rollback-candidate.json emergency-recovery.json emergency-recovery-no-action-outcome.json; do
            target="${STAGE7_EVIDENCE_ROOT}/${filename}"
            if test -s "${target}"; then files+=("${target}"); fi
          done
          test "${#files[@]}" -ge 1
          pnpm release:scan -- --pre-upload "${files[@]}"
      - name: Preserve sanitized automatic recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-recovery-probe
          if-no-files-found: error
          path: |
            output/evidence/runtime/stage-7/versioned-rollback-candidate.json
            output/evidence/runtime/stage-7/emergency-recovery.json
            output/evidence/runtime/stage-7/emergency-recovery-no-action-outcome.json
          retention-days: 30

  release-reconciliation-intent:
    name: 19 Open the immutable release reconciliation journal
    if: ${{ github.run_attempt == 1 && needs.emergency-recovery.outputs.safe_for_rehearsal == 'true' }}
    needs: emergency-recovery
    environment: assessment-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Download the immutable release identity
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-release-metadata
          path: .stage7/release-metadata
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-candidate-manifest
          path: .stage7/candidate-manifest
      - name: Download the immutable release plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-release-plan
          path: .stage7/release-plan
      - name: Download the exact reviewed diff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-infra-diff
          path: .stage7/infra-diff
      - name: Download the protected approval
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-approval
          path: .stage7/approval
      - name: Download the exact AWS authorities
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-aws-auth
          path: .stage7/aws-auth
      - name: Download the activation authority
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-activation
          path: .stage7/activation
      - name: Download the web deployment authority
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-web
          path: .stage7/web
      - name: Download the durable candidate rollback record
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-recovery-probe
          path: .stage7/recovery-probe
      - name: Download the external authorization authority
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-external-authorization
          path: .stage7/external-authorization
      - name: Download the immutable N-1 target projection
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage7-previous-release
          path: .stage7/previous
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize and validate the approved Stage 7 config
        env:
          EXPECTED_STAGE7_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          STAGE7_CONFIG_B64: ${{ vars.STAGE7_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${STAGE7_CONFIG_B64}"
          [[ "${EXPECTED_STAGE7_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          target="${RUNNER_TEMP}/stage7-config.json"
          printf '%s' "${STAGE7_CONFIG_B64}" | base64 --decode > "${target}"
          chmod 600 "${target}"
          test -s "${target}"
          test "$(stat -c '%a' "${target}")" = '600'
          actual="$(sha256sum "${target}" | cut -d ' ' -f 1)"
          test "${actual}" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${target}" > /dev/null
          private_root='.stage7/reconciliation-private'
          workspace_target="${private_root}/stage7-config.json"
          test ! -e "${private_root}"
          install -d -m 700 "${private_root}"
          install -m 600 "${target}" "${workspace_target}"
          test "$(stat -c '%a' "${workspace_target}")" = '600'
          test "$(sha256sum "${workspace_target}" | cut -d ' ' -f 1)" = "${EXPECTED_STAGE7_CONFIG_SHA256}"
          node scripts/stage7/cli.mjs config --config "${workspace_target}" > /dev/null
          printf 'STAGE7_CONFIG=%s\n' "${target}" >> "${GITHUB_ENV}"
          printf 'STAGE7_RECONCILIATION_CONFIG=%s\n' "${workspace_target}" >> "${GITHUB_ENV}"
      - name: Create the immutable 23-binding reconciliation intent
        run: |
          set -euo pipefail
          mkdir -p .stage7/reconciliation-private
          node scripts/stage7/release-reconciliation-cli.mjs create-intent \
            --config "${STAGE7_RECONCILIATION_CONFIG}" \
            --release-metadata .stage7/release-metadata/release-metadata.json \
            --candidate-manifest .stage7/candidate-manifest/candidate-manifest.json \
            --release-plan .stage7/release-plan/release-plan.json \
            --approved-diff .stage7/infra-diff/infra-diff.json \
            --raw-diff .stage7/infra-diff/infra-diff.txt \
            --github-environment-approval .stage7/approval/github-environment-approval.json \
            --approval .stage7/approval/approval.json \
            --aws-auth .stage7/aws-auth/aws-auth.json \
            --journal-role-effective-permissions .stage7/aws-auth/stage7-release-journal-role-effective-permissions.json \
            --activation .stage7/activation/activation.json \
            --web-deployment .stage7/web/web.json \
            --candidate-record .stage7/recovery-probe/versioned-rollback-candidate.json \
            --external-authorization .stage7/external-authorization/external-authorization.json \
            --previous-release-manifest .stage7/previous/previous-release-manifest.json \
            --previous-source-provenance .stage7/previous/previous-source-provenance.json \
            --previous-target-compatibility .stage7/previous/previous-target-compatibility.json \
            --previous-final-disable-provenance .stage7/previous/previous-final-disable-provenance.json \
            --previous-api-contract-evidence .stage7/previous/previous-api-contract-evidence.json \
            --previous-pending-evidence .stage7/previous/previous-pending-evidence.json \
            --previous-smoke-evidence .stage7/previous/previous-smoke-evidence.json \
            --previous-release-projection-index .stage7/previous/previous-release-projection-index.json \
            --output .stage7/reconciliation-private/release-reconciliation-intent.json
      - name: Assume the exact durable journal role before rollback mutation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          allowed-account-ids: ${{ env.STAGE7_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.STAGE7_AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"ReadOwnRoleDefinition","Effect":"Allow","Action":["iam:GetRole","iam:GetRolePolicy","iam:ListAttachedRolePolicies","iam:ListRolePolicies"],"Resource":"${{ env.STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN }}"},{"Sid":"ReadExactBoundary","Effect":"Allow","Action":["iam:GetPolicy","iam:GetPolicyVersion"],"Resource":"${{ env.STAGE7_RELEASE_JOURNAL_CLEANUP_PERMISSIONS_BOUNDARY_ARN }}"},{"Sid":"ReadExactReleaseReconciliationJournal","Effect":"Allow","Action":["ssm:GetParameter","ssm:GetParametersByPath"],"Resource":["arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/rollback/${{ inputs.candidate_sha }}/release-reconciliation/${{ github.run_id }}","arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/rollback/${{ inputs.candidate_sha }}/release-reconciliation/${{ github.run_id }}/*"]},{"Sid":"WriteImmutableReleaseReconciliationJournal","Effect":"Allow","Action":"ssm:PutParameter","Resource":["arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/rollback/${{ inputs.candidate_sha }}/release-reconciliation/${{ github.run_id }}","arn:aws:ssm:${{ env.STAGE7_AWS_REGION }}:${{ env.STAGE7_AWS_ACCOUNT_ID }}:parameter/checkout/stage7/rollback/${{ inputs.candidate_sha }}/release-reconciliation/${{ github.run_id }}/*"],"Condition":{"StringEquals":{"ssm:Overwrite":"false"}}}]}
          mask-aws-account-id: true
          output-credentials: false
          role-duration-seconds: 900
          role-session-name: e7-release-reconciliation-journal-${{ github.run_id }}
          role-to-assume: ${{ env.STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN }}
          unset-current-credentials: true
      - name: Revalidate the live journal role immediately before opening the owner
        run: |
          set -euo pipefail
          node scripts/stage7/release-successor-cli.mjs capture-journal-role-authority \
            --journal-role-arn "${STAGE7_RELEASE_JOURNAL_CLEANUP_ROLE_ARN}" \
            --permissions-boundary-arn "${STAGE7_RELEASE_JOURNAL_CLEANUP_PERMISSIONS_BOUNDARY_ARN}" \
            --aws-region "${STAGE7_AWS_REGION}" \
            --output .stage7/reconciliation-private/live-intent-journal-role-effective-permissions.json \
            --get-role-output .stage7/reconciliation-private/live-intent-journal-role-audit.json
