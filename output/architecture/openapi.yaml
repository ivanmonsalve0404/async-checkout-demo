          description: Detalles de entrega guardados
          headers:
            ETag: { $ref: '#/components/headers/StrongETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDetailsResponse' }
        '400': { $ref: '#/components/responses/RequestMalformed' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/CheckoutHidden' }
        '410': { $ref: '#/components/responses/CheckoutExpired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/FieldInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/payment-configuration:
    get:
      operationId: getPaymentConfiguration
      tags: [Payments]
      summary: Obtener configuración de captura y aceptaciones efímeras
      description: |
        Endpoint público controlado. Los tokens de aceptación son C3 efímeros:
        la respuesta completa usa no-store, no se registra y no tiene ejemplos.
        La captura real permanece bloqueada hasta SPK-02.
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/CorrelationId'
      x-api-id: API-08
      x-status: DESIGNED_NOT_IMPLEMENTED
      x-decision-status: BLOCKED_REAL_PROVIDER_UNTIL_SPK-02
      x-trace:
        requirements: [RF-17, RF-23]
        acceptanceCriteria: [AC-US-03-05, AC-US-03-06]
        scenarios: [SC-US-03-03, SC-EN-24-01]
        uat: [UAT-19, UAT-20, UAT-32]
        data: [DAT-35, DAT-36, DAT-37, DAT-38, DAT-39, DAT-60]
        errors: [ERR-02, ERR-19, ERR-20, ERR-23, ERR-24]
        uxFlows: [UXF-04, UXF-13]
      responses:
        '200':
          description: Configuración efímera de sandbox o fake
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Vary: { $ref: '#/components/headers/VaryOrigin' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfigurationResponse' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/checkouts/{checkoutId}/transactions:
    post:
      operationId: submitCheckoutTransaction
      tags: [Payments, Transactions]
      summary: Aceptar una intención de pago
      description: |
        If-Match, Idempotency-Key, capability y relación son obligatorios.
        Reserva, idempotencia y transacción local PENDING quedan durables antes
        del I/O externo. Toda intención local aceptada y todo replay semántico
        devuelven el mismo 202, body y Location originales. El estado vigente se
        consulta mediante GET; no se deduce del status HTTP de este POST.
      security:
        - CheckoutCapability: []
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentSubmissionRequest' }
      x-api-id: API-09
      x-status: DESIGNED_NOT_IMPLEMENTED
      x-stable-accepted-response:
        status: 202
        replayInvariantFields: [transactionId, statusUrl, submissionState, acceptedAt, Location]
        perRequestField: X-Correlation-Id
      x-trace:
        requirements: [RF-07, RF-08, RF-24, RF-29, RF-30, RF-32]
        acceptanceCriteria: [AC-US-05-01, AC-US-05-02, AC-US-05-03, AC-US-05-04, AC-US-05-05, AC-US-10-01, AC-US-10-02, AC-US-10-03, AC-US-10-04]
        scenarios: [SC-US-05-01, SC-US-05-02, SC-US-05-03, SC-US-05-04, SC-US-10-01, SC-US-10-02, SC-US-10-03]
        uat: [UAT-01, UAT-04, UAT-05, UAT-06, UAT-07, UAT-08, UAT-22, UAT-23, UAT-24, UAT-45, UAT-48]
        data: [DAT-11, DAT-13, DAT-15, DAT-16, DAT-17, DAT-22, DAT-23, DAT-24, DAT-26, DAT-27, DAT-28, DAT-29, DAT-30, DAT-31, DAT-32, DAT-33, DAT-34, DAT-35, DAT-36, DAT-37, DAT-38, DAT-39, DAT-40, DAT-57]
        errors: [ERR-01, ERR-02, ERR-03, ERR-05, ERR-06, ERR-07, ERR-08, ERR-09, ERR-10, ERR-11, ERR-12, ERR-13, ERR-14, ERR-18, ERR-19, ERR-20, ERR-23, ERR-24]
        uxFlows: [UXF-01, UXF-06, UXF-07, UXF-08, UXF-09]
      responses:
        '202':
          description: Intención local aceptada; usar Location para consultar
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSubmissionResponse' }
              examples:
                accepted:
                  value:
                    transactionId: TRANSACTION_LOCAL_ID
                    statusUrl: /api/v1/transactions/TRANSACTION_LOCAL_ID
                    submissionState: ACCEPTED
