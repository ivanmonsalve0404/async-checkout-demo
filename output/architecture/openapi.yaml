        acceptanceCriteria: [AC-US-09-01, AC-US-09-02, AC-US-09-05]
        scenarios: [SC-US-09-01, SC-US-09-03, SC-EN-11-02, SC-EN-11-04]
        uat: [UAT-17, UAT-25, UAT-26, UAT-28]
        data: [DAT-11, DAT-12, DAT-13, DAT-15, DAT-16, DAT-17, DAT-18, DAT-19, DAT-20, DAT-21, DAT-22, DAT-29, DAT-32, DAT-42, DAT-43, DAT-44, DAT-45, DAT-46, DAT-47, DAT-48, DAT-49, DAT-50]
        errors: [ERR-02, ERR-03, ERR-08, ERR-19, ERR-20]
        uxFlows: [UXF-12, UXF-13]
      responses:
