  /api/v1/transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Consultar el estado local canónico
      description: |
        Sólo lee estado local. Nunca llama al proveedor, finaliza, libera,
        reserva ni crea otro pago. PENDING, APPROVED, DECLINED, VOIDED y ERROR
        se representan con 200; UNKNOWN es una fase de despacho, no un final.
      security:
        - CheckoutCapability: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
