        errors: [ERR-02, ERR-03, ERR-19, ERR-20]
        uxFlows: [UXF-01, UXF-11]
      responses:
        '200':
          description: Entrega autorizada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
