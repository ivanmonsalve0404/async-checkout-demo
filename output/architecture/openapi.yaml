        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/checkouts/{checkoutId}/customer:
    put:
      operationId: replaceCheckoutCustomer
      tags: [Customers]
      summary: Guardar o reemplazar el cliente del checkout
      description: Reemplazo idempotente protegido por capability, relación y ETag fuerte.
      security:
        - CheckoutCapability: []
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCustomerRequest' }
      x-api-id: API-06
      x-status: DESIGNED_NOT_IMPLEMENTED
      x-decision-status: ASSUMED_FIELDS_FROM_DEC-07
      x-trace:
        requirements: [RF-21, RF-27, RF-32]
        acceptanceCriteria: [AC-US-03-03]
        scenarios: [SC-US-03-01, SC-EN-11-02, SC-EN-11-03]
        uat: [UAT-17, UAT-19, UAT-44]
        data: [DAT-11, DAT-13, DAT-15, DAT-41, DAT-42, DAT-43, DAT-44]
        errors: [ERR-01, ERR-02, ERR-03, ERR-05, ERR-08, ERR-09, ERR-19, ERR-20]
        uxFlows: [UXF-05, UXF-12]
      responses:
        '200':
          description: Cliente guardado
          headers:
            ETag: { $ref: '#/components/headers/StrongETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '400': { $ref: '#/components/responses/RequestMalformed' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/CheckoutHidden' }
        '410': { $ref: '#/components/responses/CheckoutExpired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/FieldInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/checkouts/{checkoutId}/delivery-details:
    put:
      operationId: replaceCheckoutDeliveryDetails
      tags: [Deliveries]
      summary: Guardar o reemplazar la intención de entrega
