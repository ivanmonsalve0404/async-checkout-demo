        data: [DAT-11, DAT-15, DAT-23, DAT-24, DAT-29, DAT-30, DAT-31, DAT-32, DAT-33, DAT-34, DAT-35, DAT-51, DAT-52, DAT-69]
        errors: [ERR-02, ERR-03, ERR-12, ERR-13, ERR-14, ERR-18, ERR-19, ERR-20, ERR-21, ERR-22]
        uxFlows: [UXF-09, UXF-10, UXF-11, UXF-12, UXF-13]
      responses:
        '200':
          description: Recurso de transacción local, terminal o no terminal
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Retry-After: { $ref: '#/components/headers/OptionalRetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
              examples:
                unknown:
                  value:
                    transactionId: TRANSACTION_LOCAL_ID
                    checkoutId: CHECKOUT_ID_OPAQUE
                    checkoutStatus: PAYMENT_PENDING
                    paymentStatus: PENDING
                    dispatchPhase: UNKNOWN
                    providerStatus: null
                    reservationStatus: ACTIVE
                    integrityStatus: OK
                    recoveryCode: PROVIDER_OUTCOME_UNKNOWN
                    statusUrl: /api/v1/transactions/TRANSACTION_LOCAL_ID
                    allowedActions: [QUERY, WAIT, RETURN_TO_PRODUCT]
                    acceptedAt: '2026-01-01T00:00:00Z'
                    updatedAt: '2026-01-01T00:00:30Z'
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/CheckoutHidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/webhooks/payment:
    post:
      operationId: receivePaymentWebhook
      tags: [Webhooks]
      summary: Recibir un evento de pago opcional
      description: |
        Operación P1 diferida. Firma, ambiente, monto, moneda, referencia y
        estado se verifican antes del finalizador idempotente. El body y la
        firma crudos sólo existen en memoria. Duplicados y eventos fuera de
        orden son 204 sin efecto; polling sigue siendo obligatorio.
      security:
        - ProviderWebhookSignature: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhookRequest' }
      x-api-id: API-11
      x-status: DEFERRED_P1_DESIGNED_NOT_IMPLEMENTED
