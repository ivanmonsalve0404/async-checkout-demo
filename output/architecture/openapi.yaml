openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Checkout sandbox API
  version: 1.0.0
  summary: Contrato HTTP del checkout invitado asíncrono
  description: |
    Contrato contract-first de Etapa 3. Está diseñado, no implementado.
    El servidor es autoridad de precio, moneda, stock, cotización y estado.
    Los datos completos de tarjeta nunca forman parte de esta API. Los valores
    efímeros de pago y aceptación sólo aparecen como campos de escritura sin
    ejemplos, defaults ni persistencia.
  x-status: DESIGNED_NOT_IMPLEMENTED
  x-source-baseline:
    requirements: 33 RF identities and 28 RNF identities
    acceptanceCriteria: 45
    scenarios: 51
    errors: 24
    dataFields: 72
    uat: 48
  x-design-decisions:
    oasVersion: OpenAPI 3.1.2 for reversible toolchain interoperability
    customerRoute: One nested PUT route under the checkout; no duplicate top-level write route
    stockRoute: Kept as a separate nominal read resource for the challenge rubric
    webhookRoute: One singular optional P1 route
    capability: HttpOnly cookie; raw value never enters JSON, URLs, logs or examples
    paymentSubmission: Every locally accepted payment submission and its semantic replay return the same 202 body and Location
    asyncOutcomes: Provider uncertainty and later incidents are represented by the local transaction resource
    localStateVocabulary: E0-E2 values NOT_SENT and ACKNOWLEDGED are preserved
servers:
  - url: https://checkout.example.invalid
    description: Symbolic HTTPS demo host; reserved invalid domain
  - url: http://localhost:3000
    description: Local fake-only environment; no external payment provider
tags:
  - { name: Products, description: Public seeded catalog }
  - { name: Stock, description: Public availability projection; internal counters are never exposed }
  - { name: Checkouts, description: Capability-bound checkout session and quote }
  - { name: Customers, description: Minimum guest customer data bound to one checkout }
  - { name: Payments, description: Ephemeral capture configuration and accepted submission }
  - { name: Transactions, description: Local canonical payment state; reads never call the provider }
  - { name: Deliveries, description: Delivery created only after a consistent approval }
  - { name: Webhooks, description: Optional P1 signed event accelerator; polling remains mandatory }
  - { name: Operations, description: Sanitized documentation and technical health }
security: []
x-canonical-error-catalog:
  - { id: ERR-01, code: REQUEST_MALFORMED, disposition: PROBLEM_400 }
  - { id: ERR-02, code: ORIGIN_FORBIDDEN, disposition: PROBLEM_403 }
  - { id: ERR-03, code: CHECKOUT_NOT_FOUND_OR_FORBIDDEN, disposition: PROBLEM_404_INDISTINGUISHABLE }
  - { id: ERR-04, code: PRODUCT_NOT_FOUND, disposition: PROBLEM_404 }
  - { id: ERR-05, code: FIELD_INVALID, disposition: PROBLEM_422 }
  - { id: ERR-06, code: OUT_OF_STOCK, disposition: PROBLEM_409 }
  - { id: ERR-07, code: QUOTE_STALE, disposition: PROBLEM_409 }
  - { id: ERR-08, code: CHECKOUT_EXPIRED, disposition: PROBLEM_410 }
  - { id: ERR-09, code: PRECONDITION_FAILED, disposition: PROBLEM_412 }
  - { id: ERR-10, code: IDEMPOTENCY_CONFLICT, disposition: PROBLEM_409 }
  - { id: ERR-11, code: PAYMENT_ALREADY_IN_PROGRESS, disposition: PROBLEM_409_WITH_LOCATION }
  - { id: ERR-12, code: PAYMENT_TOKEN_REJECTED, disposition: TRANSACTION_200_AFTER_ACCEPTED_SUBMISSION }
  - { id: ERR-13, code: PROVIDER_NOT_SENT, disposition: TRANSACTION_200_AFTER_ACCEPTED_SUBMISSION }
  - { id: ERR-14, code: PROVIDER_OUTCOME_UNKNOWN, disposition: SUBMISSION_202_AND_TRANSACTION_200 }
  - { id: ERR-15, code: WEBHOOK_SIGNATURE_INVALID, disposition: PROBLEM_401 }
  - { id: ERR-16, code: WEBHOOK_DUPLICATE, disposition: WEBHOOK_204_NO_OP }
  - { id: ERR-17, code: WEBHOOK_OUT_OF_ORDER, disposition: WEBHOOK_204_NO_OP }
  - { id: ERR-18, code: STATE_TRANSITION_CONFLICT, disposition: PROBLEM_409_OR_TRANSACTION_200_INCIDENT }
  - { id: ERR-19, code: RATE_LIMITED, disposition: PROBLEM_429 }
  - { id: ERR-20, code: INTERNAL_ERROR, disposition: PROBLEM_500_ONLY_BEFORE_AMBIGUOUS_EXTERNAL_IO }
  - { id: ERR-21, code: FINAL_STATE_CONFLICT, disposition: TRANSACTION_200_INCIDENT }
  - { id: ERR-22, code: APPROVED_INVENTORY_CONFLICT, disposition: TRANSACTION_200_INCIDENT }
  - { id: ERR-23, code: ENVIRONMENT_MISMATCH, disposition: PROBLEM_503_FAIL_CLOSED_BEFORE_ACCEPTANCE }
  - { id: ERR-24, code: PROVIDER_AUTH_OR_CONFIG_INVALID, disposition: PROBLEM_503_ONLY_BEFORE_ACCEPTANCE }
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: Listar productos activos y disponibilidad pública
      description: Consulta pública sin efectos de negocio ni contadores internos.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      x-api-id: API-01
      x-status: DESIGNED_NOT_IMPLEMENTED
      x-trace:
        requirements: [RF-01, RF-25, RF-16]
        acceptanceCriteria: [AC-US-01-01, AC-US-01-02]
        scenarios: [SC-US-01-01, SC-US-01-02]
        uat: [UAT-18, UAT-38]
        data: [DAT-01, DAT-02, DAT-03, DAT-04, DAT-05, DAT-06, DAT-07, DAT-10]
        errors: [ERR-19, ERR-20]
        uxFlows: [UXF-01, UXF-02]
      responses:
        '200':
          description: Colección pública de productos activos
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCollectionResponse' }
              examples:
                availableProduct:
                  value:
                    items:
                      - productId: PRODUCT_ID_OPAQUE
                        sku: SKU_SYNTHETIC
                        name: PRODUCT_AVAILABLE
                        description: Producto sintético para la demostración.
                        imageUrl: https://assets.example.invalid/product.svg
                        unitPrice: { amountInCents: 2500000, currency: COP }
                        available: 1
                    count: 1
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/products/{productId}:
    get:
      operationId: getProduct
      tags: [Products]
      summary: Obtener un producto activo
      description: Consulta pública sin efectos; un ID nunca concede acceso privado.
