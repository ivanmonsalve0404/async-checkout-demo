        errors: [ERR-01, ERR-15, ERR-16, ERR-17, ERR-18, ERR-19, ERR-20, ERR-21]
        uxFlows: []
      responses:
        '204':
          description: Evento aceptado, duplicado o fuera de orden; sin body y sin efecto duplicado
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '400': { $ref: '#/components/responses/RequestMalformed' }
        '401': { $ref: '#/components/responses/WebhookSignatureInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deliveries/{deliveryId}:
