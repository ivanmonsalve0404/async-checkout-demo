            Set-Cookie: { $ref: '#/components/headers/CheckoutCapabilityCookie' }
            ETag: { $ref: '#/components/headers/StrongETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Vary: { $ref: '#/components/headers/VaryOrigin' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutCreatedResponse' }
              examples:
                created:
                  value:
                    checkoutId: CHECKOUT_ID_OPAQUE
                    status: DRAFT
                    version: 1
                    quote:
                      quoteId: QUOTE_ID_OPAQUE
                      version: 1
                      productId: PRODUCT_ID_OPAQUE
                      quantity: 1
                      subtotal: { amountInCents: 2500000, currency: COP }
                      baseFee: { amountInCents: 200000, currency: COP }
                      deliveryFee: { amountInCents: 500000, currency: COP }
                      total: { amountInCents: 3200000, currency: COP }
                      expiresAt: '2026-01-01T00:15:00Z'
                    expiresAt: '2026-01-01T00:30:00Z'
        '400': { $ref: '#/components/responses/RequestMalformed' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/FieldInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/checkouts/{checkoutId}:
    get:
      operationId: getCheckout
      tags: [Checkouts]
      summary: Recuperar el checkout canónico
      description: |
        Lectura local sin efectos ni consulta al proveedor. Inexistencia,
        capability inválida y relación ajena producen el mismo 404.
      security:
        - CheckoutCapability: []
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/CorrelationId'
