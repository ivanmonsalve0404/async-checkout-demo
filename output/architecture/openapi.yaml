  /api/v1/checkouts:
    post:
      operationId: createCheckout
      tags: [Checkouts]
      summary: Crear checkout, cotización y capability
      description: |
        Crea el recurso local sincrónicamente. La capability cruda se entrega
        exclusivamente mediante Set-Cookie HttpOnly; nunca aparece en JSON.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckoutRequest' }
            examples:
              oneProduct:
                value: { productId: PRODUCT_ID_OPAQUE }
      x-api-id: API-04
      x-status: DESIGNED_NOT_IMPLEMENTED
      x-browser-security:
        csrf: Same-origin plus Origin and Fetch Metadata validation
        cookie: HttpOnly; Secure; SameSite=Strict; Path=/api/v1
        cache: No shared storage of Set-Cookie responses
      x-trace:
        requirements: [RF-02, RF-13, RF-24, RF-32]
        acceptanceCriteria: [AC-US-02-01, AC-US-04-01]
        scenarios: [SC-US-02-01, SC-US-04-01, SC-EN-11-03]
        uat: [UAT-17, UAT-21]
        data: [DAT-01, DAT-06, DAT-07, DAT-10, DAT-11, DAT-12, DAT-13, DAT-14, DAT-15, DAT-16, DAT-17, DAT-18, DAT-19, DAT-20, DAT-21, DAT-22]
        errors: [ERR-01, ERR-02, ERR-04, ERR-05, ERR-06, ERR-19, ERR-20]
        uxFlows: [UXF-01, UXF-03]
      responses:
