                    checkedAt: '2026-01-01T00:00:00Z'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    CheckoutCapability:
      type: apiKey
      in: cookie
      name: checkout_capability
      description: |
        Capability aleatoria de al menos 256 bits emitida sólo mediante una
        cookie HttpOnly, Secure, SameSite=Strict y Path=/api/v1. El servidor
        conserva únicamente su HMAC/hash. Ausencia, expiración, alteración o
        relación ajena producen el mismo 404. No hay valores ni ejemplos.
      x-data-class: C3
      x-raw-storage: COOKIE_AND_EPHEMERAL_GUARD_MEMORY_ONLY
    ProviderWebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        Contrato abstracto P1 para una firma de evento. El nombre y algoritmo
        del adapter real permanecen bloqueados hasta SPK-02; nunca se registra
        ni se ejemplifica el valor.
      x-data-class: C3
      x-status: BLOCKED_REAL_PROVIDER
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Identificador público opaco; no concede autorización.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: PRODUCT_ID_OPAQUE
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      description: Identificador opaco; la cookie relacionada sigue siendo obligatoria.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: CHECKOUT_ID_OPAQUE
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Identificador local opaco; nunca es un ID del proveedor.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: TRANSACTION_LOCAL_ID
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      description: Identificador opaco ligado al checkout autorizado.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: DELIVERY_ID_OPAQUE
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag fuerte del checkout. Ausencia o mismatch produce ERR-09 y cero mutación.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^"[^"]+"$'
      example: '"checkout-v7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave opaca de 16 a 128 caracteres para checkout+submit-payment.
        La clave cruda sólo existe durante la request; se persiste un HMAC.
        No se proporciona ejemplo o default.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
      x-data-class: C3
      x-loggable: false
    Origin:
      name: Origin
      in: header
      required: true
      description: Origen HTTPS exacto de la SPA; se valida con allowlist y Fetch Metadata.
      schema:
        type: string
        format: uri
        maxLength: 256
    OptionalOrigin:
      name: Origin
      in: header
      required: false
      description: Si está presente debe pertenecer a la allowlist; Fetch Metadata complementa la política.
      schema:
        type: string
        format: uri
        maxLength: 256
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: ID opaco opcional; el servidor genera uno seguro si falta.
      schema: { $ref: '#/components/schemas/CorrelationId' }
  headers:
    CorrelationId:
      description: Identificador opaco de la request; puede cambiar entre replays.
      schema: { $ref: '#/components/schemas/CorrelationId' }
      example: CORRELATION_ID_SAFE
    Location:
      description: URI relativa del recurso canónico creado o ya existente.
      schema:
        type: string
        format: uri-reference
        maxLength: 256
    CheckoutCapabilityCookie:
      description: |
        Cookie de capability con HttpOnly; Secure; SameSite=Strict; Path=/api/v1.
        La respuesta no se almacena en caches compartidas. El valor se omite.
      schema:
        type: string
      x-sensitive: true
      x-loggable: false
    StrongETag:
      description: ETag fuerte de la versión del checkout.
      schema:
        type: string
        pattern: '^"[^"]+"$'
      example: '"checkout-v7"'
    NoStore:
      description: Prohíbe almacenamiento de la respuesta.
      schema:
        type: string
        const: no-store
      example: no-store
    PublicCatalogCache:
      description: Cache pública breve; una reserva siempre revalida stock en backend.
      schema:
        type: string
        const: public, max-age=30
      example: public, max-age=30
    RevalidateCache:
      description: La disponibilidad se revalida y nunca autoriza una reserva.
      schema:
        type: string
        const: no-cache
      example: no-cache
    PublicDocsCache:
      description: Cache breve sólo para la interfaz documental sanitizada.
      schema:
        type: string
        const: public, max-age=300
      example: public, max-age=300
    VaryOrigin:
      description: Evita mezclar respuestas entre orígenes.
      schema:
        type: string
        const: Origin
      example: Origin
    RateLimitLimit:
      description: Límite de la ventana aplicable.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Solicitudes restantes en la ventana.
      schema:
        type: integer
        minimum: 0
    OptionalRetryAfter:
      description: Segundos sugeridos antes de otra consulta GET; nunca autoriza repetir el POST.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 300
  responses:
    RequestMalformed:
      description: ERR-01 REQUEST_MALFORMED
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformed:
              value:
                type: https://checkout.example.invalid/problems/request-malformed
                title: Solicitud inválida
                status: 400
                detail: No pudimos leer la solicitud.
                instance: urn:problem-instance:CORRELATION_ID_SAFE
                code: REQUEST_MALFORMED
                correlationId: CORRELATION_ID_SAFE
                retryable: false
    OriginForbidden:
      description: ERR-02 ORIGIN_FORBIDDEN; no revela recursos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CheckoutHidden:
      description: ERR-03 indistinguible para inexistente, capability inválida o relación ajena.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unavailable:
              value:
                type: https://checkout.example.invalid/problems/checkout-unavailable
                title: Checkout no disponible
                status: 404
                detail: El recurso no está disponible.
                instance: urn:problem-instance:CORRELATION_ID_SAFE
                code: CHECKOUT_NOT_FOUND_OR_FORBIDDEN
                correlationId: CORRELATION_ID_SAFE
                retryable: false
    ProductNotFound:
      description: ERR-04 PRODUCT_NOT_FOUND
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Conflicto de negocio con precondición técnicamente válida. El code
        distingue ERR-06, ERR-07, ERR-10, ERR-11 o ERR-18.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Location: { $ref: '#/components/headers/Location' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CheckoutExpired:
      description: ERR-08 CHECKOUT_EXPIRED; sólo aplica sin pago activo.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: ERR-09 PRECONDITION_FAILED; ausencia o mismatch de If-Match.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        ETag: { $ref: '#/components/headers/StrongETag' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FieldInvalid:
      description: ERR-05 FIELD_INVALID; no representa un conflicto concurrente.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalidField:
              value:
                type: https://checkout.example.invalid/problems/field-invalid
                title: Revisa los campos
                status: 422
                detail: Hay campos que requieren tu atención.
                instance: urn:problem-instance:CORRELATION_ID_SAFE
                code: FIELD_INVALID
                correlationId: CORRELATION_ID_SAFE
                retryable: false
                errors:
                  - path: installments
                    code: unsupported_value
                    reason: Elige una opción disponible.
    RateLimited:
      description: ERR-19 RATE_LIMITED; el retry sólo aplica al mismo método cuando sea seguro.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/OptionalRetryAfter' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: |
        ERR-20 antes de I/O externo ambiguo. Si pudo existir envío, el recurso
        aceptado permanece consultable y se proyecta como ERR-14, no como 500.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: |
        ERR-23 o ERR-24 fail-closed antes de aceptar una intención local. Nunca
        autoriza retry automático y no revela ambiente, host, llave o secreto.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/OptionalRetryAfter' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WebhookSignatureInvalid:
      description: ERR-15 WEBHOOK_SIGNATURE_INVALID; respuesta no enumerable.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Identificador opaco, no secuencial y no autorizante.
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      description: Identificador seguro sin datos personales.
    Money:
      type: object
      additionalProperties: false
      required: [amountInCents, currency]
      properties:
        amountInCents:
          type: integer
          minimum: 0
          maximum: 999999999999
          description: Importe entero; nunca float.
        currency:
          type: string
          const: COP
      example: { amountInCents: 2500000, currency: COP }
    ProductPublic:
      type: object
      additionalProperties: false
      required: [productId, sku, name, description, imageUrl, unitPrice, available]
      properties:
        productId:
          $ref: '#/components/schemas/OpaqueId'
        sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        imageUrl:
          type: string
          format: uri
          maxLength: 2048
        unitPrice:
          $ref: '#/components/schemas/Money'
        available:
          type: integer
          minimum: 0
          maximum: 999999
          readOnly: true
          description: Proyección pública derivada; no es autoridad para reservar.
    ProductResponse:
      $ref: '#/components/schemas/ProductPublic'
    ProductCollectionResponse:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProductPublic' }
        count:
          type: integer
          minimum: 0
          maximum: 100
    StockResponse:
      type: object
      additionalProperties: false
      required: [productId, available, asOf]
      properties:
        productId:
          $ref: '#/components/schemas/OpaqueId'
        available:
          type: integer
          minimum: 0
          maximum: 999999
          readOnly: true
        asOf:
          type: string
          format: date-time
          readOnly: true
    CreateCheckoutRequest:
      type: object
      additionalProperties: false
      required: [productId]
      properties:
        productId:
          $ref: '#/components/schemas/OpaqueId'
    CheckoutStatus:
      type: string
      enum: [DRAFT, READY, PAYMENT_PENDING, PAID, PAYMENT_FAILED, EXPIRED]
      description: Estados efectivos de la baseline E0-E2.
    Quote:
      type: object
      additionalProperties: false
      required: [quoteId, version, productId, quantity, subtotal, baseFee, deliveryFee, total, expiresAt]
      properties:
        quoteId:
          $ref: '#/components/schemas/OpaqueId'
        version:
          type: integer
          minimum: 1
        productId:
          $ref: '#/components/schemas/OpaqueId'
        quantity:
          type: integer
          const: 1
          description: Baseline reversible de un SKU y una unidad.
        subtotal:
          $ref: '#/components/schemas/Money'
        baseFee:
          $ref: '#/components/schemas/Money'
        deliveryFee:
          $ref: '#/components/schemas/Money'
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Igual a subtotal más baseFee más deliveryFee; servidor autoritativo.
        expiresAt:
          type: string
          format: date-time
    CheckoutCreatedResponse:
      type: object
      additionalProperties: false
      required: [checkoutId, status, version, quote, expiresAt]
